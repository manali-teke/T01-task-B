<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course grade calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Course grade calculator</h1>
    <form id="grade-form" novalidate>
      <label for="homework">Homework average (0–100)</label>
      <input id="homework" inputmode="decimal">

      <label for="midterm">Midterm exam (0–100)</label>
      <input id="midterm" inputmode="decimal">

      <label for="final">Final exam (0–100)</label>
      <input id="final" inputmode="decimal">

      <label for="extra">Extra credit points (optional)</label>
      <input id="extra" inputmode="numeric">

      <label for="note">Note (optional)</label>
      <textarea id="note" rows="3"></textarea>

      <button type="submit">Calculate grade</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script src="grades.js"></script>
</body>
</html>
